[package]
name = "pixel-perfect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Renders lossless pixel art (PNG, APNG, WebP) from declarative worksheets"
license = "Apache-2.0"
readme = "README.md"
keywords = ["pixel-art", "png", "apng", "sprite", "json-schema"]
categories = ["graphics", "command-line-utilities"]
include = ["src/**", "schema/**", "README.md", "LICENSE"]

[lib]
name = "pixel_perfect"
path = "src/lib.rs"

[[bin]]
name = "pixel-perfect"
path = "src/main.rs"

[dependencies]
blake2 = "0.11"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5.5"
ctrlc = "3.5.3"
foldhash = "0.2"
image-webp = "0.2.4"
jsonschema = { version = "0.61", default-features = false }
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
num_cpus = "1.17.0"
png = "0.18"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tempfile = "3.27.0"
thiserror = "2"
toml = "1.2"
toml_edit = "0.25.20"

[dev-dependencies]
assert_cmd = "2.2"
flate2 = "1.1.11"
regex = "1.13"
