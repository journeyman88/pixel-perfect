# A masked ball, 256x256, drawn for pixel-perfect.
#
#   pixel-perfect render examples/masquerade.yaml -o out --scale 3
#
# Built to use the whole format:
# - palettes: derived palettes dress the same dancers in other colors and
#   turn the white marble tile into the dark one;
# - sprites: derived sprites, and `overrideLines` for a taller plume and a
#   full-face mask;
# - transforms: `scale` stretches one row of fluting into a column, one
#   pixel into chains, doubles the middle chandelier and squashes floor rows
#   for perspective; `flip` mirrors curtains, capitals and dancers; `rotate`
#   turns confetti; `crop` cuts a half moon out of the full one;
# - panels: elements placed by `coordinates` and ordered by `zIndex`, one
#   hidden element;
# - scene: the `wallpaper` band is one panel used as nine layers;
# - semi-transparent glow, light pools and moonbeam blended over the hall.
$schema: ../schema/worksheet.schema.json

