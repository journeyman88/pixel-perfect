# Sprites only: one sprite per PNG encoding the engine can choose.
#
#   pixel-perfect render examples/sprites.yaml -o out --scale 8
#
# The encoding depends only on the number of distinct colors in the final image
# (fully transparent pixels count as one color):
#
#   sprite      colors  file
#   coin             2  indexed, 1 bit per pixel
#   heart            3  indexed, 2 bits (with a semi-transparent highlight)
#   slime            8  indexed, 4 bits (with a semi-transparent shadow)
#   slime-ice        8  indexed, 4 bits (same lines, derived palette)
#   sunset          27  indexed, 8 bits
#   spectrum       288  RGBA, 8 bits per channel (more than 256 colors)
$schema: ../schema/worksheet.schema.json

palettes:
  - id: gold
    colors:
      - { char: g, rgba: [240, 190, 40] }

  - id: warm
    colors:
      - { char: r, rgba: [220, 40, 60] }
      - { char: h, rgba: [255, 255, 255, 0.6] }

  - id: slime
    colors:
      - { char: o, rgba: [20, 70, 30] }        # outline
      - { char: L, rgba: [150, 230, 120] }     # light
      - { char: M, rgba: [80, 180, 70] }       # body
      - { char: D, rgba: [50, 130, 50] }       # dark side
      - { char: w, rgba: [255, 255, 255] }     # eye
      - { char: k, rgba: [10, 10, 20] }        # pupil
      - { char: s, rgba: [0, 0, 0, 0.35] }     # shadow on the ground

  # Same characters, different colors: the derived palette replaces only
  # the body colors and keeps eyes and shadow.
  - id: ice
    _palette: slime
    colors:
      - { char: o, rgba: [20, 50, 90] }
      - { char: L, rgba: [200, 240, 255] }
      - { char: M, rgba: [120, 190, 240] }
      - { char: D, rgba: [70, 130, 200] }

  - id: sunset
    colors:
      - { char: A, rgba: [40, 20, 80] }      # sky
