# A campfire in a forest clearing at night, 256x256, animated.
#
#   pixel-perfect render examples/campfire.yaml -o out --scale 3
#
# Writes three APNG files that loop forever:
#
# - flipbooks/flames.png (56x74): the fire alone, 10 fps, 1 s;
# - timelines/fire.png (256x256): flames, embers, flickering light and
#   rising sparks, 2 s;
# - scenes/campfire.png (256x256): the whole picture. The 10 fps fire, the
#   5 fps embers and the 4 fps twinkling stars share a 20 ticks-per-second
#   clock, and the scene loops every 2 s.
#
# The scene is ten layers, from the farthest plane to the nearest: sky,
# twinkling stars, mountains, two rows of distant forest, ground, the near
# trees, the logs and stones, the fire, the stones in front of it and a
# vignette. What it shows:
#
# - palettes: derived palettes give the distant mountains and the two rows
#   of distant pines their hazier colors (aerial perspective), a hotter
#   flame and a brighter glow;
# - sprites: derived sprites change only the palette (`pines-far`,
#   `pines-mid`, `mountain-far`, `flame-flash`) or only some lines
#   (`flame-b` redraws the tips of `flame-a`, with `=` to keep a pixel);
# - `tile`: the sky, both star fields, the dark cloud band, the two forest
#   rows, the grass and its ragged edge are each one small tile repeated;
#   the sky is a 2x160 dithered gradient tiled to the full width;
# - `scale`: one row of bark stretched into the trunk, a mountain shrunk
#   into the distant range, the middle row of pines enlarged before tiling;
# - `flip`: the distant range, the tree on the right, branches, stones,
#   firewood, the vignette corners, and a mirrored frame of the flames;
# - `rotate`: standing stones, the vignette corner and edges, firewood;
# - `crop`: a short log end cut from the fallen trunk, a patch of moss;
# - flipbooks: the flames (6 frames, one of them flipped) and the embers,
#   at different fps, both used as elements of a panel;
# - timelines: `twinkle` hides and shows stars with `setVisible`; `fire`
#   uses every transition: `moveTo` for the sparks, `setVisible` for sparks
#   and the brighter glow (hidden in the panel), `moveToZ` to bring a spark
#   from behind the flames to the front, `appendTransforms` and
#   `resetTransforms` to mirror the flames for a moment, `seekFlipbook` to
#   jump the flames to another frame;
# - scene: panels and timelines stacked by `zIndex`;
# - semi-transparent clouds, haze, firelight and vignette blended over the
#   layers below.
$schema: ../schema/worksheet.schema.json

palettes:
  # Night sky. Semi-transparent clouds blend with the gradient.
  - id: sky
    colors:
      - { char: "1", rgba: [10, 14, 34] }  # sky, top
      - { char: "2", rgba: [16, 24, 52] }
      - { char: "3", rgba: [22, 38, 72] }
      - { char: "4", rgba: [30, 60, 96] }
      - { char: "5", rgba: [46, 94, 120] }
      - { char: "6", rgba: [76, 134, 146] }  # sky, horizon
      - { char: "*", rgba: [240, 240, 220] }  # star
      - { char: "+", rgba: [140, 152, 190] }  # dim star
      - { char: "o", rgba: [236, 140, 70] }  # drifting ember
      - { char: "C", rgba: [250, 200, 180, 0.6] }  # cloud, lit
      - { char: "c", rgba: [220, 150, 150, 0.45] }  # cloud
      - { char: "k", rgba: [12, 18, 40, 0.55] }  # dark cloud
      - { char: "K", rgba: [12, 18, 40, 0.3] }  # dark cloud, fringe
  - id: mountain
    colors:
      - { char: "m", rgba: [50, 70, 110] }
      - { char: "M", rgba: [86, 96, 140] }  # lit face
      - { char: "n", rgba: [36, 50, 84] }  # shadow face
      - { char: "s", rgba: [196, 206, 230] }  # snow
      - { char: "S", rgba: [236, 178, 160] }  # snow, lit
      - { char: "i", rgba: [80, 124, 150, 0.1] }  # haze, thin
      - { char: "j", rgba: [80, 124, 150, 0.2] }  # haze
      - { char: "h", rgba: [80, 124, 150, 0.3] }  # haze, thick
  # Farther away: less contrast, closer to the sky.
  - id: mountain-far
    _palette: mountain
    colors:
      - { char: "m", rgba: [64, 96, 130] }
      - { char: "M", rgba: [96, 116, 156] }
      - { char: "n", rgba: [54, 80, 114] }
      - { char: "s", rgba: [160, 184, 212] }
      - { char: "S", rgba: [206, 168, 168] }
  - id: forest
    colors:
      - { char: "a", rgba: [12, 26, 28] }  # needles
      - { char: "b", rgba: [20, 42, 38] }  # needles, light
      - { char: "g", rgba: [36, 68, 50] }  # needles, highlight
      - { char: "x", rgba: [6, 12, 14] }  # darkest
      - { char: "t", rgba: [92, 50, 34] }  # bark
      - { char: "T", rgba: [140, 80, 50] }  # bark, lit
      - { char: "u", rgba: [184, 112, 64] }  # bark, firelit
      - { char: "r", rgba: [52, 28, 22] }  # bark, shadow
      - { char: "n", rgba: [30, 54, 32] }  # moss, shadow
      - { char: "m", rgba: [52, 88, 42] }  # moss
      - { char: "M", rgba: [98, 134, 58] }  # moss, lit
  # The same pines, hazier with distance.
  - id: pine-far
    _palette: forest
    colors:
      - { char: "a", rgba: [32, 58, 78] }
      - { char: "b", rgba: [40, 72, 90] }
      - { char: "g", rgba: [54, 88, 104] }
      - { char: "x", rgba: [26, 48, 66] }
  - id: pine-mid
    _palette: forest
    colors:
      - { char: "a", rgba: [20, 40, 50] }
      - { char: "b", rgba: [28, 54, 60] }
      - { char: "g", rgba: [40, 70, 70] }
      - { char: "x", rgba: [14, 28, 36] }
  # Clearing, stones and wood.
  - id: camp
    colors:
      - { char: "h", rgba: [22, 44, 32] }  # grass, dark
      - { char: "g", rgba: [38, 70, 40] }  # grass
      - { char: "G", rgba: [70, 104, 50] }  # grass, light
      - { char: "y", rgba: [138, 138, 60] }  # dry grass
      - { char: "d", rgba: [108, 62, 42] }  # dirt
      - { char: "D", rgba: [142, 86, 54] }  # dirt, light
      - { char: "e", rgba: [80, 46, 36] }  # dirt, dark
      - { char: "E", rgba: [176, 112, 66] }  # pebble
      - { char: "p", rgba: [96, 100, 124] }  # stone
      - { char: "P", rgba: [146, 148, 166] }  # stone, light
      - { char: "q", rgba: [50, 52, 70] }  # stone, shadow
      - { char: "l", rgba: [104, 58, 34] }  # wood
      - { char: "L", rgba: [156, 92, 50] }  # wood, light
      - { char: "w", rgba: [56, 30, 20] }  # wood, shadow
      - { char: "R", rgba: [196, 140, 86] }  # sawn wood
      - { char: "K", rgba: [70, 40, 28] }  # bark crack
      - { char: "k", rgba: [34, 22, 18] }  # charcoal
      - { char: "z", rgba: [6, 8, 14, 0.4] }  # shadow
  - id: fire
    colors:
      - { char: "r", rgba: [196, 46, 24] }  # flame, edge
      - { char: "o", rgba: [240, 116, 32] }  # flame
      - { char: "y", rgba: [255, 194, 62] }  # flame, hot
      - { char: "w", rgba: [255, 244, 196] }  # flame, core
      - { char: "e", rgba: [255, 214, 110] }  # spark
      - { char: "c", rgba: [118, 34, 20] }  # ember, dim
      - { char: "k", rgba: [38, 22, 18] }  # ash
  # A flare: every flame color one step hotter.
  - id: fire-hot
    _palette: fire
    colors:
      - { char: "r", rgba: [228, 82, 30] }
      - { char: "o", rgba: [255, 158, 52] }
      - { char: "y", rgba: [255, 228, 124] }
  # Firelight: five rings, each a little stronger, so no edge shows.
  - id: glow
    colors:
      - { char: "A", rgba: [255, 140, 50, 0.04] }
      - { char: "B", rgba: [255, 145, 55, 0.08] }
      - { char: "C", rgba: [255, 150, 60, 0.12] }
      - { char: "D", rgba: [255, 160, 70, 0.17] }
      - { char: "E", rgba: [255, 170, 80, 0.22] }
