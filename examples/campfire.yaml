flipbooks:
  # 10 frame-units at 10 fps: the flames loop every second.
  - id: flames
    width: 56
    height: 74
    fps: 10
    frames:
      - { _sprite: flame-a, coordinates: [0, 0], duration: 2 }
      - { _sprite: flame-b, coordinates: [0, 0], duration: 2 }
      - { _sprite: flame-c, coordinates: [0, 0], duration: 1 }
      - { _sprite: flame-flash, coordinates: [0, 0], duration: 1 }
      - { _sprite: flame-a, coordinates: [0, 0], duration: 2, transforms: [{ kind: flip, axis: x }] }
      - { _sprite: flame-d, coordinates: [0, 0], duration: 2 }
  # The embers pulse at their own 5 fps.
  - id: embers
    width: 40
    height: 7
    fps: 5
    frames:
      - { _sprite: coals, coordinates: [0, 0], duration: 3 }
      - { _sprite: coals-hot, coordinates: [0, 0], duration: 2 }

