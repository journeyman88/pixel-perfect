      - { char: "C", rgba: [255, 160, 70, 0.17] }
      - { char: "D", rgba: [255, 172, 84, 0.23] }
      - { char: "E", rgba: [255, 184, 96, 0.3] }
  # Vignette: ten steps of the same dark blue, stronger toward the edges.
  - id: shade
    colors:
      - { char: "a", rgba: [6, 8, 18, 0.05] }
      - { char: "b", rgba: [6, 8, 18, 0.1] }
      - { char: "c", rgba: [6, 8, 18, 0.15] }
