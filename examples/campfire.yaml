  - id: campfire
    width: 256
    height: 256
    elements:
      - { id: glow, _sprite: glow, coordinates: [88, 190] }
      - { id: glow-bright, _sprite: glow-bright, coordinates: [88, 190], visible: false }
      - { _sprite: glow-air, coordinates: [118, 112] }
      - { _sprite: stick, coordinates: [140, 200], zIndex: 1, transforms: [{ kind: flip, axis: x }] }
      - { _sprite: stick, coordinates: [164, 200], zIndex: 1 }
      - { id: embers, _flipbook: embers, coordinates: [143, 208], zIndex: 2 }
      - { id: flames, _flipbook: flames, coordinates: [135, 139], zIndex: 3 }
      - { _sprite: stick, coordinates: [136, 206], zIndex: 4 }
      - { _sprite: stick, coordinates: [170, 206], zIndex: 4, transforms: [{ kind: flip, axis: x }] }
      - { _sprite: stick, coordinates: [150, 211], zIndex: 4, transforms: [{ kind: rotate, degrees: 90 }, { kind: rotate, degrees: 90 }] }
      - { id: k0, _sprite: spark, coordinates: [160, 180], zIndex: 1 }
      - { id: k1, _sprite: spark-long, coordinates: [170, 176], zIndex: 1, visible: false }
      - { id: k2, _sprite: spark, coordinates: [156, 170], zIndex: 1, visible: false }
      - { id: k3, _sprite: spark, coordinates: [166, 160], zIndex: 1, visible: false }
      - { id: k4, _sprite: spark-long, coordinates: [158, 150], zIndex: 1 }
      - { id: k5, _sprite: spark, coordinates: [172, 168], zIndex: 1, visible: false }
      - { id: k6, _sprite: spark, coordinates: [150, 124], zIndex: 1 }
      - { id: k7, _sprite: spark, coordinates: [176, 128], zIndex: 1 }
  # Stones in front of the fire.
  - id: front-stones
    width: 256
    height: 256
    elements:
      - { _sprite: rock, coordinates: [134, 220], transforms: [{ kind: flip, axis: x }] }
      - { _sprite: rock-small, coordinates: [150, 224] }
      - { _sprite: rock, coordinates: [160, 222] }
      - { _sprite: rock-small, coordinates: [176, 221], transforms: [{ kind: flip, axis: x }] }
      - { _sprite: rock, coordinates: [186, 216], transforms: [{ kind: rotate, degrees: 180 }] }
      - { _sprite: rock-small, coordinates: [124, 216], transforms: [{ kind: rotate, degrees: 270 }] }
  # Darker corners and edges: one corner and one edge strip, flipped, rotated and tiled.
  - id: vignette
    width: 256
    height: 256
    elements:
      - { _sprite: vignette-corner, coordinates: [0, 0] }
      - { _sprite: vignette-corner, coordinates: [192, 0], transforms: [{ kind: flip, axis: x }] }
      - { _sprite: vignette-corner, coordinates: [0, 192], transforms: [{ kind: flip, axis: y }] }
      - { _sprite: vignette-corner, coordinates: [192, 192], transforms: [{ kind: rotate, degrees: 180 }] }
      - _sprite: vignette-edge
        coordinates: [0, 64]
        transforms: [{ kind: tile, width: 64, height: 128 }]
      - _sprite: vignette-edge
        coordinates: [192, 64]
        transforms: [{ kind: flip, axis: x }, { kind: tile, width: 64, height: 128 }]
      - _sprite: vignette-edge
        coordinates: [64, 0]
        transforms: [{ kind: rotate, degrees: 90 }, { kind: tile, width: 128, height: 64 }]
      - _sprite: vignette-edge
        coordinates: [64, 192]
        transforms: [{ kind: rotate, degrees: 270 }, { kind: tile, width: 128, height: 64 }]

timelines:
  # 8 frame-units at 4 fps: each star blinks once every 2 s.
  - id: twinkle
    _panel: bright-stars
    fps: 4
    duration: 8
    transitions:
      - { kind: setVisible, _element: s0, value: false, at: 0 }
      - { kind: setVisible, _element: s0, value: true, at: 1 }
      - { kind: setVisible, _element: s1, value: false, at: 3 }
      - { kind: setVisible, _element: s1, value: true, at: 5 }
      - { kind: setVisible, _element: s2, value: false, at: 6 }
      - { kind: setVisible, _element: s2, value: true, at: 7 }
      - { kind: setVisible, _element: s3, value: false, at: 1 }
      - { kind: setVisible, _element: s3, value: true, at: 3 }
      - { kind: setVisible, _element: s4, value: false, at: 4 }
      - { kind: setVisible, _element: s4, value: true, at: 5 }
      - { kind: setVisible, _element: s5, value: false, at: 7 }
      - { kind: setVisible, _element: s5, value: true, at: 1 }
      - { kind: setVisible, _element: s6, value: false, at: 2 }
      - { kind: setVisible, _element: s6, value: true, at: 3 }
      - { kind: setVisible, _element: s7, value: false, at: 5 }
      - { kind: setVisible, _element: s7, value: true, at: 7 }
  # 20 frame-units at 10 fps: 2 s, twice the flames' loop.
  - id: fire
    _panel: campfire
    fps: 10
    duration: 20
    transitions:
      # The light flares now and then.
      - { kind: setVisible, _element: glow-bright, value: true, at: 3 }
      - { kind: setVisible, _element: glow-bright, value: false, at: 5 }
      - { kind: setVisible, _element: glow-bright, value: true, at: 13 }
      - { kind: setVisible, _element: glow-bright, value: false, at: 14 }
      - { kind: setVisible, _element: glow-bright, value: true, at: 17 }
      - { kind: setVisible, _element: glow-bright, value: false, at: 19 }
      # In the second half the flames play mirrored and from another frame.
      - { kind: appendTransforms, _element: flames, transforms: [{ kind: flip, axis: x }], at: 10 }
      - { kind: seekFlipbook, _element: flames, frameIndex: 2, at: 10 }
      - { kind: resetTransforms, _element: flames, at: 16 }
      # The embers skip ahead to glow out of step with the flames.
      - { kind: seekFlipbook, _element: embers, frameIndex: 1, at: 7 }
      # Sparks rise and drift. They start behind the flames and come to the
      # front once above them.
      - { kind: moveTo, _element: k0, coordinates: [150, 110], start: 0, duration: 12 }
      - { kind: moveToZ, _element: k0, value: 5, at: 3 }
      - { kind: setVisible, _element: k0, value: false, at: 12 }
      - { kind: setVisible, _element: k1, value: true, at: 3 }
      - { kind: moveTo, _element: k1, coordinates: [184, 96], start: 3, duration: 14 }
      - { kind: moveToZ, _element: k1, value: 5, at: 6 }
      - { kind: setVisible, _element: k1, value: false, at: 17 }
      - { kind: setVisible, _element: k2, value: true, at: 6 }
      - { kind: moveTo, _element: k2, coordinates: [140, 92], start: 6, duration: 13 }
      - { kind: moveToZ, _element: k2, value: 5, at: 9 }
      - { kind: setVisible, _element: k2, value: false, at: 19 }
      - { kind: setVisible, _element: k3, value: true, at: 9 }
      - { kind: moveTo, _element: k3, coordinates: [176, 120], start: 9, duration: 8 }
      - { kind: moveToZ, _element: k3, value: 5, at: 12 }
      - { kind: setVisible, _element: k3, value: false, at: 17 }
      - { kind: moveTo, _element: k4, coordinates: [148, 100], start: 0, duration: 7 }
      - { kind: setVisible, _element: k4, value: false, at: 7 }
      - { kind: setVisible, _element: k5, value: true, at: 12 }
      - { kind: moveTo, _element: k5, coordinates: [196, 104], start: 12, duration: 8 }
      - { kind: moveToZ, _element: k5, value: 5, at: 15 }
      - { kind: moveTo, _element: k6, coordinates: [140, 70], start: 0, duration: 10 }
      - { kind: setVisible, _element: k6, value: false, at: 10 }
      - { kind: moveTo, _element: k7, coordinates: [190, 80], start: 0, duration: 9 }
      - { kind: setVisible, _element: k7, value: false, at: 9 }

scenes:
  - id: campfire
    width: 256
    height: 256
    layers:
      - { _panel: sky, coordinates: [0, 0], zIndex: 0 }
      - { _timeline: twinkle, coordinates: [0, 0], zIndex: 1 }
      - { _panel: mountains, coordinates: [0, 0], zIndex: 2 }
      - { _panel: far-forest, coordinates: [0, 0], zIndex: 3 }
      - { _panel: ground, coordinates: [0, 0], zIndex: 4 }
      - { _panel: near-trees, coordinates: [0, 0], zIndex: 5 }
      - { _panel: camp, coordinates: [0, 0], zIndex: 6 }
      - { _timeline: fire, coordinates: [0, 0], zIndex: 7 }
      - { _panel: front-stones, coordinates: [0, 0], zIndex: 8 }
      - { _panel: vignette, coordinates: [0, 0], zIndex: 9 }

exports:
  - /flipbooks/flames
  - /timelines/fire
  - /scenes/campfire
