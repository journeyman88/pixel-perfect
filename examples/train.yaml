flipbooks:
  - id: wheel-big
    width: 18
    height: 18
    fps: 16
    frames:
      - { _sprite: wheel-big-0, coordinates: [0, 0], duration: 1 }
      - { _sprite: wheel-big-1, coordinates: [0, 0], duration: 1 }
      - { _sprite: wheel-big-2, coordinates: [0, 0], duration: 1 }
  - id: wheel-small
    width: 10
    height: 10
    fps: 16
    frames:
      - { _sprite: wheel-small-0, coordinates: [0, 0], duration: 1 }
      - { _sprite: wheel-small-1, coordinates: [0, 0], duration: 1 }
      - { _sprite: wheel-small-2, coordinates: [0, 0], duration: 1 }
  - id: smoke
    width: 80
    height: 20
    fps: 16
    frames:
      - { _sprite: smoke-0, coordinates: [0, 0], duration: 1 }
      - { _sprite: smoke-1, coordinates: [0, 0], duration: 1 }
      - { _sprite: smoke-2, coordinates: [0, 0], duration: 1 }

panels:
  - id: sky
    width: 256
    height: 256
    elements:
      - _sprite: sky
        coordinates: [0, 0]
        transforms: [{ kind: tile, width: 256, height: 256 }]
  - id: mountain
    width: 256
    height: 134
    elements:
      - { _sprite: mountain, coordinates: [0, 0] }
  # Each scrolling plane is as wide as the canvas plus the distance it moves
  # in one loop, so its edge never shows.
  - id: city
    width: 384
    height: 74
    elements:
      - _sprite: city
        coordinates: [0, 0]
        transforms: [{ kind: tile, width: 384, height: 74 }]
  - id: field
    width: 256
    height: 36
    elements:
      - _sprite: field
        coordinates: [0, 0]
        transforms: [{ kind: tile, width: 256, height: 36 }]
  - id: poles
    width: 768
    height: 120
    elements:
      - _sprite: pole
        coordinates: [0, 0]
        transforms: [{ kind: tile, width: 768, height: 120 }]
  - id: track
    width: 1024
    height: 30
    elements:
      - _sprite: track
        coordinates: [0, 0]
        transforms: [{ kind: tile, width: 1024, height: 30 }]
  # The train, 232x76. The bottom row is where the wheels touch the rail.
  - id: train
    width: 232
    height: 76
    elements:
      - { id: coach, _sprite: coach, coordinates: [0, 33] }
      - { id: tender, _sprite: tender, coordinates: [92, 36] }
      - { id: loco, _sprite: loco, coordinates: [138, 16] }
      - { _flipbook: wheel-small, coordinates: [8, 66], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [20, 66], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [58, 66], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [70, 66], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [96, 66], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [109, 66], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [122, 66], zIndex: 1 }
      - { _flipbook: wheel-big, coordinates: [156, 58], zIndex: 1 }
      - { _flipbook: wheel-big, coordinates: [176, 58], zIndex: 1 }
      - { _flipbook: wheel-big, coordinates: [196, 58], zIndex: 1 }
      - { _flipbook: wheel-small, coordinates: [214, 66], zIndex: 1 }
      - { _flipbook: smoke, coordinates: [138, 0], zIndex: 2 }

timelines:
  - id: rumble
    description: The locomotive, the tender and the coach bounce one after the other.
    _panel: train
    fps: 16
    duration: 8
    transitions:
      - { kind: moveTo, _element: loco, coordinates: [138, 15], start: 0, duration: 1 }
      - { kind: moveTo, _element: loco, coordinates: [138, 16], start: 2, duration: 1 }
      - { kind: moveTo, _element: tender, coordinates: [92, 35], start: 2, duration: 1 }
      - { kind: moveTo, _element: tender, coordinates: [92, 36], start: 4, duration: 1 }
      - { kind: moveTo, _element: coach, coordinates: [0, 32], start: 4, duration: 1 }
      - { kind: moveTo, _element: coach, coordinates: [0, 33], start: 6, duration: 1 }

scenes:
  - id: countryside
    width: 256
    height: 256
    layers:
      - { _panel: sky, coordinates: [0, 0] }
      - { _panel: mountain, coordinates: [0, 60], zIndex: 1 }
      - { id: city, _panel: city, coordinates: [0, 120], zIndex: 2 }
      - { _panel: field, coordinates: [0, 190], zIndex: 3 }
      - { id: poles, _panel: poles, coordinates: [0, 98], zIndex: 4 }
      - { id: track, _panel: track, coordinates: [0, 226], zIndex: 5 }
      # Centered and still: the camera travels with the train. The wheels
      # sit on the rail at y 226.
      - { _timeline: rumble, coordinates: [12, 150], zIndex: 6 }

sequences:
  - id: ride
    description: Seen from alongside the train, the landscape scrolls by at the speed of its distance.
    _scene: countryside
    fps: 16
    duration: 128
    actions:
      - { kind: moveTo, _layer: track, coordinates: [-768, 226], start: 0, duration: 128 }
      - { kind: moveTo, _layer: poles, coordinates: [-512, 98], start: 0, duration: 128 }
      - { kind: moveTo, _layer: city, coordinates: [-128, 120], start: 0, duration: 128 }

exports:
  - /sequences/ride
