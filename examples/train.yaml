# A steam train crossing the countryside, 256x256, animated.
#
#   pixel-perfect render examples/train.yaml -o out --scale 3
#
# Writes one APNG file that loops forever:
#
# - sequences/ride.png (256x256): a train traveling to the right, seen by
#   a camera that travels with it, 8 s.
#
# The scene `countryside` stacks seven layers. Four of them are the planes
# of the picture. The train stays still in the middle of the canvas and
# everything else scrolls left, faster the nearer it is:
#
# 1. foreground: the train, a timeline layer that bounces in place, over
#    the track, which scrolls left by 6 px per frame-unit;
# 2. near background: telephone poles and their wires, scrolling left by 4,
#    which give the sense of speed;
# 3. far background: city buildings, scrolling left by 1;
# 4. very far background: a snowy mountain over a hazy plain, still, at
#    the distance where the parallax vanishes.
#
# The sky and a field behind the poles are static and plain enough (only
# horizontal bands) that they do not give the camera away. What it shows:
#
# - parallax with `moveTo`: each scrolling plane is a panel made with one
#   `tile`, moved by a whole number of tiles per loop (1x128, 4x128 and
#   16x48 pixels), so it loops seamlessly;
# - an animated layer in a sequence: `rumble` keeps its own 0.5 s rhythm
#   while `ride` scrolls the planes around it;
# - bouncing: in `rumble` the locomotive, the tender and the coach each
#   rise by one pixel for 2 frame-units, one after the other, as if they
#   rolled over a rail joint. The wheels stay on the rail;
# - flipbooks as elements: spoked wheels turning (3 frames each) and a
#   trail of semi-transparent smoke (3 frames), all on the same 16 fps
#   clock as the timeline and the sequence.
$schema: ../schema/worksheet.schema.json

palettes:
  - id: sky
    colors:
      - { char: "1", rgba: [62, 108, 182] }  # sky, top
      - { char: "2", rgba: [80, 130, 198] }
      - { char: "3", rgba: [104, 154, 210] }
      - { char: "4", rgba: [132, 178, 220] }
      - { char: "5", rgba: [164, 200, 228] }
      - { char: "6", rgba: [196, 216, 230] }
      - { char: "7", rgba: [224, 226, 220] }  # sky, horizon
  # Very far: low contrast, close to the sky.
  - id: mountain
    colors:
      - { char: "M", rgba: [146, 160, 198] }  # rock, lit
      - { char: "m", rgba: [120, 132, 178] }  # rock, shadow
      - { char: "S", rgba: [238, 242, 250] }  # snow, lit
      - { char: "s", rgba: [196, 206, 230] }  # snow, shadow
      - { char: "h", rgba: [166, 186, 212] }  # haze
      - { char: "f", rgba: [132, 158, 170] }  # foothills, crest
      - { char: "F", rgba: [118, 146, 156] }  # foothills
      - { char: "p", rgba: [146, 170, 158] }  # plain
      - { char: "q", rgba: [134, 160, 146] }  # plain, nearer
  - id: city
    colors:
      - { char: "b", rgba: [138, 154, 182] }  # back row
      - { char: "B", rgba: [120, 136, 168] }  # back row, shaded side
      - { char: "G", rgba: [176, 196, 220] }  # back row, window
      - { char: "D", rgba: [110, 124, 156] }  # back row, dark window
      - { char: "c", rgba: [110, 124, 156] }  # front row
      - { char: "C", rgba: [92, 104, 138] }  # front row, shaded side
      - { char: "g", rgba: [168, 190, 216] }  # front row, window
      - { char: "d", rgba: [78, 90, 120] }  # front row, dark window
  - id: field
    colors:
      - { char: "a", rgba: [128, 162, 104] }  # far edge
      - { char: "b", rgba: [114, 154, 88] }
      - { char: "c", rgba: [102, 146, 76] }
      - { char: "d", rgba: [92, 136, 68] }
      - { char: "e", rgba: [84, 126, 62] }  # near the track
  - id: pole
    colors:
      - { char: "P", rgba: [104, 76, 54] }  # wood
      - { char: "p", rgba: [138, 104, 74] }  # wood, lit
      - { char: "Q", rgba: [70, 52, 38] }  # wood, shadow
      - { char: "i", rgba: [200, 226, 214] }  # insulator
      - { char: "w", rgba: [44, 44, 52] }  # wire
  - id: track
    colors:
      - { char: "H", rgba: [214, 218, 224] }  # rail head
      - { char: "h", rgba: [128, 132, 142] }  # rail
      - { char: "k", rgba: [62, 62, 70] }  # rail web
      - { char: "t", rgba: [104, 74, 50] }  # sleeper
      - { char: "u", rgba: [70, 50, 36] }  # sleeper, shadow
      - { char: "x", rgba: [156, 146, 134] }  # ballast
      - { char: "y", rgba: [126, 118, 108] }
      - { char: "z", rgba: [98, 92, 86] }
      - { char: "l", rgba: [104, 148, 64] }  # grass, lit
      - { char: "g", rgba: [74, 116, 50] }  # grass
      - { char: "G", rgba: [58, 96, 42] }  # grass, nearest
  - id: train
    colors:
      - { char: "L", rgba: [42, 96, 66] }  # livery green
      - { char: "l", rgba: [70, 130, 90] }  # green, lit
      - { char: "d", rgba: [26, 62, 44] }  # green, shadow
      - { char: "B", rgba: [212, 172, 76] }  # brass, lining
      - { char: "b", rgba: [250, 224, 140] }  # brass, highlight
      - { char: "K", rgba: [30, 30, 36] }  # black
      - { char: "k", rgba: [70, 70, 80] }  # black, lit
      - { char: "R", rgba: [176, 44, 38] }  # red
      - { char: "w", rgba: [255, 236, 150] }  # lamp
      - { char: "G", rgba: [128, 170, 200] }  # glass
      - { char: "g", rgba: [210, 230, 240] }  # glass, glare
      - { char: "C", rgba: [126, 40, 46] }  # coach maroon
      - { char: "c", rgba: [158, 62, 64] }  # maroon, lit
      - { char: "D", rgba: [90, 28, 34] }  # maroon, shadow
      - { char: "Y", rgba: [232, 214, 170] }  # cream
      - { char: "O", rgba: [86, 86, 96] }  # roof
      - { char: "o", rgba: [124, 124, 134] }  # roof, lit
      - { char: "T", rgba: [64, 64, 72] }  # tyre
      - { char: "t", rgba: [170, 170, 182] }  # tyre, lit
      - { char: "V", rgba: [244, 244, 248, 0.9] }  # smoke
      - { char: "v", rgba: [226, 226, 234, 0.55] }  # smoke, thin

