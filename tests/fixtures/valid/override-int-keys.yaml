# overrideLines keys written as plain YAML integers are read as strings.
palettes:
  - id: p
    colors: [{ char: r, rgba: [255, 0, 0] }, { char: g, rgba: [0, 255, 0] }]
sprites:
  - id: base
    _palette: p
    lines: ["rr", "gg", "rg"]
  - id: derived
    _sprite: base
    overrideLines:
      1: "=r"
      2: rr
